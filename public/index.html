<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Virtual Chemistry Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ===== App shell ===== -->
<div id="app-shell">
  <header class="navbar">
    <div class="navbar-inner">
      <div class="brand"><span class="flask-icon">⚗</span> ChemLab</div>

      <nav class="navbar-links" id="navbar-links">
        <a class="nav-link" data-view="dashboard"><span class="icon">◈</span> Dashboard</a>
        <a class="nav-link" data-view="periodic-table"><span class="icon">▦</span> Periodic Table</a>
        <a class="nav-link" data-view="lab"><span class="icon">⚗</span> Virtual Lab</a>
        <a class="nav-link" data-view="calculators"><span class="icon">∑</span> Calculators</a>
        <a class="nav-link" data-view="experiments"><span class="icon">🧪</span> Experiments</a>
        <a class="nav-link" data-view="quiz"><span class="icon">✓</span> Quiz Mode</a>
        <a class="nav-link" data-view="tutor"><span class="icon">✦</span> AI Tutor</a>
      </nav>

      <div class="navbar-actions">
        <button class="theme-toggle" id="theme-toggle">☾ Dark</button>
        <div class="user-chip">
          <div class="avatar-dot" id="avatar-dot">?</div>
          <span id="user-name-label">—</span>
        </div>
        <button class="mobile-nav-toggle" id="mobile-nav-toggle">☰</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div id="view-container" class="view"></div>
  </main>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/periodic.js"></script>
<script src="/js/lab.js"></script>
<script src="/js/calculators.js"></script>
<script src="/js/experiments.js"></script>
<script src="/js/quiz.js"></script>
<script src="/js/tutor.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
